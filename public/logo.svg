<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Репозиторий работ: сервер-хранилище в виде книги</title>
  <!-- back cover and page block: the server stands like a hardcover book -->
  <rect x="14" y="5" width="42" height="55" fill="#1f3a5f"/>
  <rect x="49" y="7" width="5" height="51" fill="#fff"/>
  <path d="M49 13h5M49 19h5M49 25h5M49 31h5M49 37h5M49 43h5M49 49h5" stroke="#c9d6e8" stroke-width="1"/>
  <!-- front cover = server front panel, spine on the left -->
  <rect x="8" y="3" width="42" height="55" fill="#1f3a5f"/>
  <rect x="8" y="3" width="5" height="55" fill="#152a47"/>
  <rect x="8" y="8" width="5" height="1.5" fill="#c9d6e8"/>
  <rect x="8" y="51.5" width="5" height="1.5" fill="#c9d6e8"/>
  <!-- drive bays with vents and status lights -->
  <g fill="#2f527f">
    <rect x="17" y="10" width="29" height="9"/>
    <rect x="17" y="22" width="29" height="9"/>
    <rect x="17" y="34" width="29" height="9"/>
  </g>
  <g fill="#c9d6e8">
    <rect x="20" y="12.5" width="12" height="1.5"/>
    <rect x="20" y="15" width="12" height="1.5"/>
    <rect x="20" y="24.5" width="12" height="1.5"/>
    <rect x="20" y="27" width="12" height="1.5"/>
    <rect x="20" y="36.5" width="12" height="1.5"/>
    <rect x="20" y="39" width="12" height="1.5"/>
  </g>
  <circle cx="41" cy="14.5" r="1.8" fill="#d42a3d"/>
  <circle cx="41" cy="26.5" r="1.8" fill="#fff"/>
  <circle cx="41" cy="38.5" r="1.8" fill="#fff"/>
  <!-- power button -->
  <circle cx="31.5" cy="50" r="3.2" fill="none" stroke="#fff" stroke-width="1.6"/>
  <path d="M31.5 45.6v3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- bookmark ribbon -->
  <path d="M41 55h4v9l-2-2.4-2 2.4z" fill="#d42a3d"/>
</svg>
