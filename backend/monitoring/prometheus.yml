# Инфраструктура через встроенные /metrics. HTTP-цифры сервисов и время ответа LLM — из логов в Loki.
global: {scrape_interval: 30s}
scrape_configs:
  - {job_name: rabbitmq, metrics_path: /metrics/per-object, static_configs: [{targets: ["rabbitmq:15692"]}]}  # по очередям
  - {job_name: postgres, static_configs: [{targets: ["postgres-exporter:9187"]}]}
  - {job_name: minio, metrics_path: /minio/v2/metrics/cluster, static_configs: [{targets: ["minio:9000"]}]}
