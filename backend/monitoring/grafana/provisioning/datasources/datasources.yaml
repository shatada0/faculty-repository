# Настройки как код. Пароль grafana_ro — из секрета, в репозитории его нет.
apiVersion: 1
datasources:
  - {name: Loki, uid: loki, type: loki, access: proxy, url: http://loki:3100, isDefault: true}
  - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: http://prometheus:9090}
  - name: PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_ro
    jsonData: {database: app, sslmode: disable, postgresVersion: 1700}
    secureJsonData: {password: "$__file{/run/secrets/db_grafana}"}
