[alembic]
script_location = migrations
prepend_sys_path = .
# File name: YYYY_MM_DD_NNNN-<revision>_<slug>.py, revision YYYYMMDD_NNNN.
# Create with --rev-id YYYYMMDD_NNNN, then put the same NNNN in place of the literal NNNN below.
# ASCII only here: on Windows alembic reads this file in the local code page.
file_template = %%(year)d_%%(month).2d_%%(day).2d_NNNN-%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
